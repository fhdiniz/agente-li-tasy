[project]
name = "agente-li-tasy"
version = "0.2.0"
description = "Servidor MCP local do Agente LI Tasy: base de conhecimento do Tasy e gerador de LI, Manual e CCI"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5",
    "pillow>=10.1",
]

[project.scripts]
agente-li = "agente_li.servidor:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agente_li"]

[tool.pytest.ini_options]
testpaths = ["testes"]
